# Render Blueprint for the FastAPI backend (optional; any Python host works).
# Secrets are set in the Render dashboard, never here. Python is pinned to 3.14.8 (PYTHON_VERSION
# below; backend/.python-version says 3.14), matching local development and CI.
services:
  - type: web
    name: exl-advisor-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.14.8"
      - key: ENVIRONMENT
        value: production
      - key: AUTH_MODE
        value: supabase
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
