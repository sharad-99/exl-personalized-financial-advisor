# Render Blueprint for the FastAPI backend (optional; any Python host works).
# Secrets are set in the Render dashboard, never here. Set PYTHON_VERSION to a
# Render-supported 3.12+ release (verify the list in Render's docs).
services:
  - type: web
    name: exl-advisor-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: AUTH_MODE
        value: supabase
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
