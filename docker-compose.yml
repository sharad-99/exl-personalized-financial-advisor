# Local services for development only. The app itself runs natively (make api / make web).
# Usage: cp .env.example .env && docker compose up -d db
#        then set in backend/.env:
#        DATABASE_URL=postgresql://exl_dev:<POSTGRES_PASSWORD>@localhost:54329/exl_advisor
#        and run: make migrate && make seed
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-exl_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-exl_advisor}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-54329}:5432"
    volumes:
      - exl_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-exl_dev} -d ${POSTGRES_DB:-exl_advisor}"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  exl_pgdata:
