[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "exl-financial-advisor-api"
version = "0.1.0"
description = "FastAPI backend for the EXL Personalized Financial Advisor (synthetic data only)."
readme = "../README.md"
requires-python = ">=3.12"
# Direct runtime dependencies are pinned exactly; the full transitive lock is
# requirements.txt (generated with `pip freeze` from a clean venv).
dependencies = [
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
  "pydantic==2.14.1",
  "pydantic-settings==2.16.1",
  "sqlalchemy==2.1.6",
  "psycopg[binary]==3.3.6",
  "pandas==3.1.0",
  "numpy==2.5.4",
  "pyjwt[crypto]==2.15.1",
  "certifi==2026.10.23",
  "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.17.2",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "postgres: requires a PostgreSQL database via TEST_DATABASE_URL (skipped otherwise)",
]
filterwarnings = [
  "error::DeprecationWarning:app.*",
  "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "C4", "SIM"]
ignore = ["B008", "S101", "C408", "UP046"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]
"app/synthetic_data/**" = ["S311"]

[tool.coverage.run]
source = ["app"]
omit = ["app/synthetic_data/seed.py"]
