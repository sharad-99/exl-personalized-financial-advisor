name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (unit, integration, security — SQLite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests ../scripts
      - run: ruff format --check app tests ../scripts
      - run: python ../scripts/validate_synthetic_data.py --seed 42
      - run: python -m pytest -q --cov=app --cov-report=term-missing

  backend-postgres:
    name: Backend against PostgreSQL (migrations, RLS, API)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-throwaway
          POSTGRES_DB: exl_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql://postgres:ci-only-throwaway@localhost:5432/exl_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q -m postgres

  frontend:
    name: Frontend (typecheck, lint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  e2e:
    name: End-to-end journey (Playwright, synthetic data)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      # Throwaway, CI-only values for the local demo login. Not production secrets.
      ENVIRONMENT: test
      AUTH_MODE: local
      LOCAL_JWT_SECRET: ci-only-local-jwt-secret-not-used-anywhere-else-0000
      LOCAL_DEMO_PASSWORD: ci-demo-password
      E2E_PASSWORD: ci-demo-password
      DATABASE_URL: sqlite:///./data/ci.db
      API_BASE_URL: http://localhost:8000
      E2E_BROWSER_CHANNEL: ""
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Start backend with seeded synthetic data
        working-directory: backend
        run: |
          pip install -r requirements.txt
          python -m app.synthetic_data.seed --seed 42 --reset
          nohup uvicorn app.main:app --port 8000 > ../api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:8000/health && break; sleep 1; done
      - name: Build and start frontend
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run build
          nohup npm run start > ../web.log 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:3000/login && break; sleep 1; done
      - name: Run Playwright
        working-directory: frontend
        run: npm run e2e
      - if: failure()
        run: tail -n 100 api.log web.log
